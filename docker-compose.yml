services:
  mtech-db:
    image: postgres:16-alpine
    container_name: mtech-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mtech}
      POSTGRES_USER: ${POSTGRES_USER:-mtech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGCTLTIMEOUT: 60
    volumes:
      - mtech-db-data:/var/lib/postgresql/data
    networks:
      - mtech-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mtech} -d ${POSTGRES_DB:-mtech}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mtech-crm-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mtech-crm-app
    restart: unless-stopped
    depends_on:
      mtech-db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-mtech}:${POSTGRES_PASSWORD}@mtech-db:5432/${POSTGRES_DB:-mtech}?schema=public"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      CRON_SECRET: ${CRON_SECRET}
      SYNC_API_KEY: ${SYNC_API_KEY}
      LINVIX_USER: ${LINVIX_USER}
      LINVIX_PASSWORD: ${LINVIX_PASSWORD}
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      TZ: America/Sao_Paulo
    networks:
      - mtech-internal
      - traefik
    ports:
      - "127.0.0.1:3002:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  mtech-cron:
    build:
      context: ./cron
      dockerfile: Dockerfile
    container_name: mtech-cron
    restart: unless-stopped
    depends_on:
      mtech-crm-app:
        condition: service_healthy
      mtech-db:
        condition: service_healthy
    environment:
      APP_URL: "http://mtech-crm-app:3000"
      CRON_SECRET: ${CRON_SECRET}
      POSTGRES_HOST: mtech-db
      POSTGRES_USER: ${POSTGRES_USER:-mtech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mtech}
      TZ: America/Sao_Paulo
    volumes:
      - ./backups:/backups
    networks:
      - mtech-internal

volumes:
  mtech-db-data:
    name: mtech-db-data

networks:
  mtech-internal:
    driver: bridge
  traefik:
    external: true
    name: duda-bot_duda-network
